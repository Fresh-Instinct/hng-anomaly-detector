events {
    worker_connections 4096;
}

http {
    # ✅ EXACT JSON format required by detector
    log_format hng_json '{"timestamp":"$time_iso8601","source_ip":"$realip_remote_addr","method":"$request_method","path":"$request_uri","status":"$status","response_size":"$bytes_sent","request_time":"$request_time"}';
    
    # ✅ Logs to NAMED VOLUME path
    access_log /var/log/nginx/hng-access.log hng_json;
    
    # ✅ TRUST/FORWARD REAL CLIENT IP
    set_real_ip_from 0.0.0.0/0;                    # All proxies
    set_real_ip_from 10.0.0.0/8;                   # Docker
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;                # ✅ REQUIRED
    real_ip_recursive on;
    
    server {
        listen 80 default_server;
        server_name _;
        
        # ✅ Health check (logs JSON)
        location /health {
            access_log on;
            return 200 "HNG Nextcloud Proxy OK";
            add_header Content-Type text/plain;
        }
        
        # ✅ Main proxy (logs ALL requests)
        location / {
            proxy_pass http://nextcloud:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # ✅ CRITICAL
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
}
